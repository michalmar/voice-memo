name: VoicePrompt
options:
  bundleIdPrefix: com.example.voiceprompt
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  VoicePromptKit:
    path: ../Packages/VoicePromptKit
targets:
  VoicePromptIOS:
    type: application
    platform: iOS
    sources:
      - path: VoicePromptIOS/Sources
      - path: VoicePromptIOS/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.voiceprompt.ios
        INFOPLIST_FILE: VoicePromptIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoicePromptIOS/VoicePromptIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: VoicePromptKit
    scheme:
      testTargets: []
  VoicePromptMac:
    type: application
    platform: macOS
    sources:
      - path: VoicePromptMac/Sources
      - path: VoicePromptMac/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.voiceprompt.macos
        INFOPLIST_FILE: VoicePromptMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoicePromptMac/VoicePromptMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: VoicePromptKit

