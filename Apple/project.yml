name: VoicePrompt
options:
  bundleIdPrefix: com.michalmar.voiceprompt
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  VoicePromptKit:
    path: ../Packages/VoicePromptKit
targets:
  VoicePromptIOS:
    type: application
    platform: iOS
    sources:
      - path: VoicePromptIOS/Sources
      - path: VoicePromptIOS/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michalmar.voiceprompt.ios
        INFOPLIST_FILE: VoicePromptIOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: VoicePromptIOS/VoicePromptIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    configFiles:
      Debug: Configuration.xcconfig
      Release: Configuration.xcconfig
    dependencies:
      - package: VoicePromptKit
    scheme:
      testTargets:
        - VoicePromptIOSTests
  VoicePromptIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoicePromptIOSTests
      - path: ../Packages/VoicePromptKit/Tests/VoicePromptKitTests/HTTPStub.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VoicePromptIOS
      - package: VoicePromptKit
  VoicePromptMac:
    type: application
    platform: macOS
    sources:
      - path: VoicePromptMac/Sources
      - path: VoicePromptMac/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michalmar.voiceprompt.macos
        INFOPLIST_FILE: VoicePromptMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoicePromptMac/VoicePromptMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    configFiles:
      Debug: Configuration.xcconfig
      Release: Configuration.xcconfig
    dependencies:
      - package: VoicePromptKit
    scheme:
      testTargets:
        - VoicePromptMacTests
  VoicePromptMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VoicePromptMacTests
      - path: ../Packages/VoicePromptKit/Tests/VoicePromptKitTests/HTTPStub.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VoicePromptMac
      - package: VoicePromptKit
