name: Deploy backend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: voiceprompt-production-backend
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
      WORKER_JOB_NAME: ${{ vars.WORKER_JOB_NAME }}
      CLEANUP_JOB_NAME: ${{ vars.CLEANUP_JOB_NAME }}
      API_URL: ${{ vars.API_URL }}

    steps:
      - name: Resolve tested commit
        id: commit
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            sha="${WORKFLOW_RUN_SHA}"
          else
            sha="${DISPATCH_SHA}"
          fi
          [[ -n "${sha}" ]]
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "tag=sha-${sha}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          for name in \
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP ACR_NAME CONTAINER_APP_NAME \
            WORKER_JOB_NAME CLEANUP_JOB_NAME API_URL
          do
            [[ -n "${!name:-}" ]] || {
              echo "::error::GitHub Actions variable ${name} is not configured."
              exit 1
            }
          done
          [[ "${API_URL}" == https://* ]] || {
            echo "::error::API_URL must be a fully qualified HTTPS URL."
            exit 1
          }

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Enable required Azure CLI extensions
        run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: Build backend in Azure Container Registry
        run: |
          set -euo pipefail
          az acr build \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --registry "${ACR_NAME}" \
            --image "voiceprompt:${{ steps.commit.outputs.tag }}" \
            backend

      - name: Resolve immutable image
        id: image
        run: |
          set -euo pipefail
          login_server=$(az acr show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${ACR_NAME}" \
            --query loginServer \
            --output tsv)
          digest=$(az acr repository show \
            --name "${ACR_NAME}" \
            --image "voiceprompt:${{ steps.commit.outputs.tag }}" \
            --query digest \
            --output tsv)
          [[ "${digest}" == sha256:* ]]
          image="${login_server}/voiceprompt@${digest}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "Deploying ${image}"

      - name: Deploy immutable image
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}"
          az containerapp update \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${CONTAINER_APP_NAME}" \
            --image "${image}" \
            --output none
          az containerapp job update \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${WORKER_JOB_NAME}" \
            --image "${image}" \
            --output none
          az containerapp job update \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${CLEANUP_JOB_NAME}" \
            --image "${image}" \
            --output none

      - name: Verify deployment
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}"
          for attempt in {1..12}; do
            status=$(curl --silent --show-error --output /tmp/ready.json \
              --write-out '%{http_code}' "${API_URL%/}/health/ready" || true)
            if [[ "${status}" == "200" ]]; then
              break
            fi
            if [[ "${attempt}" == "12" ]]; then
              echo "::error::API readiness check failed with HTTP ${status}."
              exit 1
            fi
            sleep 10
          done
          grep -q '"status":"ready"' /tmp/ready.json
          for attempt in {1..12}; do
            curl --fail --silent --show-error \
              "${API_URL%/}/openapi.json?sha=${{ steps.commit.outputs.sha }}&attempt=${attempt}" \
              --output /tmp/openapi.json
            if python - <<'PY'
          import json

          with open("/tmp/openapi.json") as source:
              schema = json.load(source)
          operation = schema["paths"]["/v1/transcriptions"]["post"]
          assert any(item.get("name") == "X-Refine" for item in operation["parameters"])
          assert "refined" in schema["components"]["schemas"]["Transcript"]["properties"]
          PY
            then
              break
            fi
            if [[ "${attempt}" == "12" ]]; then
              echo "::error::Deployed API contract did not become active."
              exit 1
            fi
            sleep 10
          done

          api_image=$(az containerapp show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${CONTAINER_APP_NAME}" \
            --query 'properties.template.containers[0].image' \
            --output tsv)
          worker_image=$(az containerapp job show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${WORKER_JOB_NAME}" \
            --query 'properties.template.containers[0].image' \
            --output tsv)
          cleanup_image=$(az containerapp job show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${CLEANUP_JOB_NAME}" \
            --query 'properties.template.containers[0].image' \
            --output tsv)
          [[ "${api_image}" == "${image}" ]]
          [[ "${worker_image}" == "${image}" ]]
          [[ "${cleanup_image}" == "${image}" ]]

      - name: Summarize deployment
        run: |
          {
            echo "## Backend deployed"
            echo
            echo "- Commit: \`${{ steps.commit.outputs.sha }}\`"
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- API: ${API_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
