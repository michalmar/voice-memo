name: CI
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e 'backend[test]'
      - run: pytest backend/tests
      - run: python scripts/export-openapi.py
      - run: git diff --exit-code api/openapi.json
  swift-package:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: Packages/VoicePromptKit
  apple-build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cp Configuration.xcconfig.example Configuration.xcconfig
        working-directory: Apple
      - run: xcodegen generate
        working-directory: Apple
      - run: xcodebuild -project VoicePrompt.xcodeproj -scheme VoicePromptIOS -destination 'platform=iOS Simulator,name=iPhone 17' CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test
        working-directory: Apple
      - run: xcodebuild -project VoicePrompt.xcodeproj -scheme VoicePromptMac -destination 'platform=macOS' CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test
        working-directory: Apple
